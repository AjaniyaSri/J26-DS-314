project:
  name: c2_weather_specific_depth_study
  random_state: 42

data:
  raw_csv: ../C2_Weather_RawData_9AM_Water_Level_2025- .csv
  engineered_csv: ../C2_Weather_EngineeredData_9AM_Water_Level_2025 - Copy.csv
  hybrid_csv: ../C2_Weather_HybridData_9AM_Water_Level_2025.csv
  date_format: "%d/%m/%Y"
  station_column: station
  date_column: date
  level_column: water_level_9am_m
  expected_level_unit: m

features:
  raw_daily_weather:
    - rainfall_mm
    - soil_moisture_0_7cm
    - soil_moisture_7_28cm
    - temperature_C
  rainfall_windows:
    - rainfall_3day_mm
    - rainfall_7day_mm
    - rainfall_14day_mm
  water_level_lags_days: [1, 3, 7]
  daily_weather_lag_days: 1

splits:
  train_start: "2025-11-17"
  train_end: "2025-12-07"
  validation_start: "2025-12-08"
  validation_end: "2025-12-15"
  test_start: "2025-12-16"
  test_end: "2025-12-24"

model:
  early_stopping_rounds: 30
  candidates:
    - max_depth: 2
      learning_rate: 0.03
      min_child_weight: 5
      reg_lambda: 5.0
    - max_depth: 3
      learning_rate: 0.03
      min_child_weight: 5
      reg_lambda: 10.0
    - max_depth: 2
      learning_rate: 0.05
      min_child_weight: 10
      reg_lambda: 10.0
  n_estimators: 500
  n_jobs: 4

outputs:
  interim_dir: data/interim
  processed_dir: data/processed
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  figures_dir: outputs/figures
  evidence_dir: outputs/pp1_evidence
  model_dir: models/xgboost